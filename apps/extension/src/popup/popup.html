<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRASCO Cyber Guardian</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 360px;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      font-size: 22px;
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    .brand-text p {
      font-size: 10px;
      color: #94a3b8;
    }

    .badge-status {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #6ee7b7;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 1.5s infinite;
    }

    /* Engine Heartbeat Bar */
    .engine-heartbeat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      margin-bottom: 14px;
    }

    .engine-status-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .engine-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
      transition: all 0.3s;
    }

    .engine-text {
      color: #cbd5e1;
      font-weight: 500;
    }

    .engine-retry {
      background: none;
      border: none;
      color: #38bdf8;
      cursor: pointer;
      font-size: 10px;
      text-decoration: underline;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .toggles-box {
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label {
      font-weight: 500;
      color: #e2e8f0;
    }

    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #06b6d4;
    }

    input:checked+.slider:before {
      transform: translateX(16px);
    }

    /* Scan Box */
    .scan-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .scan-input {
      width: 100%;
      height: 60px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      color: #f8fafc;
      font-size: 12px;
      resize: none;
      margin-bottom: 8px;
      outline: none;
    }

    .scan-input:focus {
      border-color: #06b6d4;
    }

    .btn-scan {
      width: 100%;
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-scan:hover {
      background: #0284c7;
    }

    /* Image Dropzone */
    .dropzone {
      border: 2px dashed #475569;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      background: #0f172a;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.06);
    }

    .dropzone-text {
      font-size: 11px;
      color: #94a3b8;
    }

    .dropzone-preview {
      display: none;
      max-width: 100%;
      max-height: 110px;
      margin: 0 auto 6px auto;
      border-radius: 6px;
      object-fit: contain;
    }

    /* Result Box */
    .result-box {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      display: none;
    }

    .result-box.HIGH {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .result-box.MEDIUM {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid #f59e0b;
      color: #fcd34d;
    }

    .result-box.LOW {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #6ee7b7;
    }

    .btn-dashboard {
      width: 100%;
      background: transparent;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-dashboard:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <div class="brand-text">
        <h1>TRASCO</h1>
        <p>AI Cyber Guardian</p>
      </div>
    </div>
    <div id="statusBadge" class="badge-status">
      <span class="badge-dot"></span>
      <span>AKTIF</span>
    </div>
  </div>

  <!-- Live Backend Connection Bar -->
  <div class="engine-heartbeat">
    <div class="engine-status-left">
      <span id="backendStatusDot" class="engine-dot"></span>
      <span id="backendStatusText" class="engine-text">Memeriksa Backend Engine...</span>
    </div>
    <button id="btnRetryEngine" class="engine-retry">Periksa Ulang</button>
  </div>

  <div class="section-title">Pengaturan Proteksi</div>
  <div class="toggles-box">
    <div class="toggle-row">
      <span class="toggle-label">Perlindungan Real-Time</span>
      <label class="switch">
        <input type="checkbox" id="toggleProtection" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Peringatan Suara Avatar</span>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="btnTestVoice"
          style="background: none; border: 1px solid #06b6d4; color: #38bdf8; border-radius: 4px; padding: 1px 6px; font-size: 10px; cursor: pointer;">Tes
          Suara</button>
        <label class="switch">
          <input type="checkbox" id="toggleAudio" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <div class="section-title">Pindai Teks / Link Cepat</div>
  <div class="scan-card">
    <textarea id="scanInput" class="scan-input"
      placeholder="Tempel teks chat, SMS penipuan, atau URL yang mencurigakan..."></textarea>
    <button id="btnScan" class="btn-scan">
      <span>⚡</span>
      <span>Pindai dengan AI Engine</span>
    </button>
    <div id="scanResult" class="result-box"></div>
  </div>

  <div class="section-title">Pindai Gambar Penipuan (Image Scam)</div>
  <div class="scan-card">
    <input type="file" id="imageFileInput" accept="image/jpeg,image/png,image/webp" style="display: none;">
    <div id="imageDropzone" class="dropzone">
      <img id="imagePreview" class="dropzone-preview" alt="Preview gambar">
      <div id="dropzonePrompt">
        <span style="font-size: 20px;">🖼️</span>
        <p class="dropzone-text" style="font-weight: 500; color: #e2e8f0; margin-top: 4px;">Pilih atau Tarik Gambar</p>
        <p class="dropzone-text" style="font-size: 10px; color: #64748b;">Maksimal 5 MiB (JPEG, PNG, WebP)</p>
      </div>
    </div>
    <div id="imageFileInfo"
      style="display: none; font-size: 11px; color: #94a3b8; margin-bottom: 8px; justify-content: space-between; align-items: center;">
      <span id="imageFileName"
        style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;"></span>
      <button id="btnRemoveImage"
        style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 11px;">Hapus</button>
    </div>
    <button id="btnScanImage" class="btn-scan" style="background: #6366f1;" disabled>
      <span>🔍</span>
      <span>Pindai Gambar</span>
    </button>
    <div id="imageScanResult" class="result-box"></div>
  </div>

  <div style="display: flex; gap: 8px;">
    <button id="btnOpenDashboard" class="btn-dashboard">
      <span>📊</span>
      <span>Dashboard</span>
    </button>
    <button id="btnOpenPlayground" class="btn-dashboard" style="border-color: #06b6d4; color: #38bdf8;">
      <span>🎮</span>
      <span>Test Playground</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>

</html>
