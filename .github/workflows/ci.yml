name: TRASCO Quality Gate & CI

on:
  push:
    branches:
      - main
      - master
      - feature/**
  pull_request:
    branches:
      - main
      - master
      - feature/**

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend & Security Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend & Security Tests (pytest)
        env:
          GEMINI_API_KEY: ""
          PYTHONPATH: "."
        run: |
          pytest -v

  dashboard-validation:
    name: Dashboard & Contracts Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript & Shared Contracts)
        run: npx tsc --noEmit

      - name: Build Dashboard
        run: npm run build

  extension-validation:
    name: Browser Extension Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Manifest JSON
        run: |
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (manifest.manifest_version !== 3) {
            console.error('Invalid manifest_version: must be 3');
            process.exit(1);
          }
          if (!manifest.name || !manifest.version) {
            console.error('Missing name or version');
            process.exit(1);
          }
          console.log('Manifest V3 validation passed:', manifest.name, 'v' + manifest.version);
          "

      - name: Validate JavaScript Syntax
        run: |
          node --check src/background/service-worker.js
          node --check src/content/content-script.js
          node --check src/popup/popup.js
          echo "Extension JavaScript syntax check passed."

